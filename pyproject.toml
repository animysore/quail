[project]
name = "quail-engine"
version = "0.1.0"
description = "Quail: a declarative query engine for AI.IF and AI_JOIN"
readme = "README.md"
license = "MIT"
# The Modal image and tested vLLM build use Python 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlglot==30.17.0",
    "transformers==5.15.0",
    "huggingface-hub==1.27.0",
    "pyarrow==25.0.1",
    "numpy==2.3.5; sys_platform != 'emscripten' and sys_platform != 'win32'",
    "numpy==2.5.2; sys_platform == 'emscripten' or sys_platform == 'win32'",
    "gigatoken==0.10.0",
    "datasets==5.0.1",
    # same version as the Modal image; vLLM has Linux wheels only
    "vllm==0.26.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Quail Server (quail-server), the optional query server; the client
# side of a remote Session needs only the standard library
server = [
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[project.scripts]
quail-server = "quail.server.__main__:main"

[project.entry-points."vllm.general_plugins"]
quail_gigatoken = "quail.backends.vllm:register_gigatoken"

[project.urls]
Documentation = "https://fsdatalab.github.io/quail"
Repository = "https://github.com/fsdatalab/quail"
Issues = "https://github.com/fsdatalab/quail/issues"

[dependency-groups]
dev = [
    # Modal demos and experiments need proxy support behind HTTPS proxies.
    "modal[api-proxy-support]==1.5.4",
    # uploads a finished labeling pass to the public bucket
    "boto3==1.43.89",
    "matplotlib==3.11.1",
    "pytest==9.1.1",
    # the quail-b benchmark; quail/bench/ is its runner for Quail
    "quail-b",
    "ruff==0.12.9",
    "vulture==2.16",
    # the Modal images sync this group: the readout probe reads the
    # corpus tables with pandas, and hf_transfer speeds up checkpoint
    # downloads
    "pandas==3.0.5",
    "hf-transfer==0.1.9",
]

[tool.uv.sources]
quail-b = { git = "https://github.com/fsdatalab/quail-bench.git", rev = "a4a08bbcecb38aeb7933188a322a1ec3d0570ea2" }

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quail"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "quail",
]
exclude = [
    "demos",
    "docs",
]

[tool.uv]
# uv's Python builds include the C headers Triton needs at startup
python-preference = "only-managed"
required-version = "==0.12.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, N naming, D docstrings
# (Google style). D1xx (missing docstrings) stays off until the backlog
# of undocumented public methods is written.
select = ["E", "F", "W", "I", "N", "D"]
# N803/N806: Triton kernels take upper-case constexpr arguments and
# shape variables (H, KH, D) by convention. N812: torch.nn.functional
# is imported as F everywhere.
ignore = ["D1", "N803", "N806", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["quail", "quail_b", "experiments"]

[tool.vulture]
paths = ["quail"]
min_confidence = 70
